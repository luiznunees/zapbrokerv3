<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carrossel 4/6 — Perder contatos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0A0E1A; --sky: #2E7CF6; --sky-deep: #0B3B82; --lime: #D4FF3F; --mist: #F5F7FA; --ink: #0F1424; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; }
  body {
    font-family: 'Manrope', sans-serif;
    background: var(--mist);
    color: var(--ink);
    position: relative;
    overflow: hidden;
    padding: 80px;
    display: flex;
    flex-direction: column;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; display: flex; align-items: center; gap: 10px; color: var(--ink); }
  .logo .mark { width: 38px; height: 38px; border-radius: 11px; background: var(--ink); display: flex; align-items: center; justify-content: center; }
  .logo .mark svg { width: 20px; height: 20px; }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(15,20,36,0.16); }
  .dots i.on { background: var(--sky); width: 26px; border-radius: 6px; }

  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .q { font-size: 30px; font-weight: 700; color: rgba(15,20,36,0.55); line-height: 1.4; max-width: 9.6em; }
  .answer { display: flex; align-items: baseline; gap: 22px; margin-top: 30px; }
  .no { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 130px; line-height: 1; color: var(--sky-deep); letter-spacing: -0.02em; }
  .why { font-size: 30px; font-weight: 700; line-height: 1.42; max-width: 8.4em; }

  .bottom { display: flex; align-items: center; justify-content: space-between; }
  .swipe { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 22px; color: rgba(15,20,36,0.5); }
  .swipe svg { width: 26px; height: 26px; }
</style>
</head>
<body>
  <div class="top">
    <div class="logo">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L3 7v6c0 5 3.8 8.7 9 9 5.2-.3 9-4 9-9V7l-9-5z" fill="#fff"/><path d="M8.5 12.2l2.4 2.4 4.6-5" stroke="#0F1424" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      zapbroker
    </div>
    <div class="dots"><i></i><i></i><i></i><i class="on"></i><i></i><i></i></div>
  </div>

  <div class="mid">
    <div class="q">"Vou perder minhas conversas e contatos?"</div>
    <div class="answer">
      <span class="no">Não.</span>
      <span class="why">Continua tudo no mesmo número. Nada se apaga.</span>
    </div>
  </div>

  <div class="bottom">
    <div class="swipe">Próxima dúvida <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  </div>
</body>
</html>
