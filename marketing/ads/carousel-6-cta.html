<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carrossel 6/6 — CTA final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0A0E1A; --sky: #2E7CF6; --sky-deep: #0B3B82; --lime: #D4FF3F; --mist: #F5F7FA; --ink: #0F1424; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; }
  body {
    font-family: 'Manrope', sans-serif;
    background: var(--lime);
    color: var(--ink);
    position: relative;
    overflow: hidden;
    padding: 80px;
    display: flex;
    flex-direction: column;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; display: flex; align-items: center; gap: 10px; }
  .logo .mark { width: 38px; height: 38px; border-radius: 11px; background: var(--ink); display: flex; align-items: center; justify-content: center; }
  .logo .mark svg { width: 20px; height: 20px; }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(15,20,36,0.2); }
  .dots i.on { background: var(--ink); width: 26px; border-radius: 6px; }

  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 90px; }
  .eyebrow { font-size: 22px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sky-deep); }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 68px; line-height: 1.08; letter-spacing: -0.02em; text-wrap: balance; margin-top: 20px; max-width: 9.6em; }
  p.sub { font-size: 28px; font-weight: 700; margin-top: 22px; color: rgba(15,20,36,0.72); }

  .cta { margin-top: 44px; display: inline-flex; align-self: flex-start; align-items: center; gap: 16px; background: var(--ink); color: var(--lime); border-radius: 999px; padding: 26px 40px; font-weight: 800; font-size: 32px; }
  .cta svg { width: 30px; height: 30px; }
</style>
</head>
<body>
  <div class="top">
    <div class="logo">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L3 7v6c0 5 3.8 8.7 9 9 5.2-.3 9-4 9-9V7l-9-5z" fill="#fff"/><path d="M8.5 12.2l2.4 2.4 4.6-5" stroke="#D4FF3F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      zapbroker
    </div>
    <div class="dots"><i></i><i></i><i></i><i></i><i></i><i class="on"></i></div>
  </div>

  <div class="mid">
    <div class="eyebrow">Sem enrolação</div>
    <h1>Bora ver na prática?</h1>
    <p class="sub">Cadastro em 2 minutos. Primeiro disparo é grátis.</p>
    <div class="cta">Testar grátis <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  </div>
</body>
</html>
